<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Personal OS Weekly Schedule</title>
<style>
:root{--bg:#000;--panel:#05050a;--line:#282044;--text:#f7f3ff;--muted:#8e88a8;--purple:#9b6cff;--blue:#2c7dff;--pink:#ff4fd8;--green:#43d983;--amber:#ffbd59;--red:#ff5b6e;--px:1.08px}
*{box-sizing:border-box}body{margin:0;background:#000;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh;background:#000;padding:14px}
.topbar{height:84px;border:1px solid #322057;border-radius:18px;background:linear-gradient(180deg,#0d0b15,#05050a);display:flex;justify-content:space-between;align-items:center;padding:18px 22px;box-shadow:0 0 38px rgba(91,42,169,.18)}.badges{display:flex;gap:10px;align-items:center}.badge{border:1px solid #433060;background:#0b0a13;border-radius:8px;padding:9px 14px;color:#fff;font-size:14px;letter-spacing:.12em;font-weight:1000}.synced{color:#49ff9f;border-color:#136b51;background:rgba(16,194,119,.1)}.unsynced{color:#ff6d79;border-color:#7b1c2b;background:rgba(255,91,110,.1)}
.nav{display:flex;gap:12px}.nav button{height:50px;border-radius:12px;border:1px solid #49306c;background:#090812;color:#fff;font-weight:1000;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(166,108,255,.06);display:flex;align-items:center;justify-content:center;line-height:1}.nav .arrow{width:60px;font-size:24px;padding:0}.nav .today{min-width:112px;font-size:15px;letter-spacing:.08em;padding:0 18px}.nav button:hover{border-color:#9b6cff;background:#120d20}
.calendar{margin-top:16px;display:grid;grid-template-columns:62px repeat(7,1fr);border:1px solid #2b2147;border-radius:16px;overflow:hidden;background:#05050a;box-shadow:0 20px 60px rgba(0,0,0,.65)}.timecol,.day{position:relative;min-height:calc((945 * var(--px)) + 54px);background:#05050a;border-right:1px solid #2b2147}.day:last-child{border-right:0}.head{height:54px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #2b2147;background:#070710;font-weight:1000;letter-spacing:.16em;font-size:14px}.todayCol .head{color:#b875ff;box-shadow:inset 0 2px 0 #9b6cff}.grid{position:relative;height:calc(945 * var(--px));background:linear-gradient(to bottom,rgba(255,255,255,.055) 1px,transparent 1px) 0 0/100% calc(60 * var(--px))}
.tlabel{position:absolute;right:9px;transform:translateY(-50%);font-size:14px;font-weight:1000;text-shadow:0 0 8px rgba(155,108,255,.8)}.event{position:absolute;left:8px;right:8px;border:1px solid;border-radius:10px;padding:9px 10px;overflow:hidden}.event .time{font-size:12px;font-weight:1000;margin-bottom:4px}.event .title{font-size:15px;font-weight:1000;line-height:1.15}.event .meta{font-size:11px;opacity:.9;margin-top:5px;color:#d7d0ea}
.compact{padding:2px 8px;display:flex;align-items:center}.compact .time{margin:0;font-size:11px}.compact .title,.compact .meta{display:none}.routine{background:rgba(80,24,137,.34);border-color:#8e4bff;color:#caa9ff}.school{background:rgba(8,28,56,.74);border-color:#0d77ff;color:#2c8dff}.wind{background:rgba(8,96,52,.45);border-color:#17b66e;color:#78ffc0}.agency{background:rgba(76,0,45,.58);border-color:#ff45d6;color:#ff69e2}.work{background:rgba(90,51,0,.48);border-color:#ffb33f;color:#ffd17b}.evening{background:rgba(45,23,84,.5);border-color:#9b6cff;color:#dac4ff}
@media(max-width:1100px){.app{overflow-x:auto}.topbar,.calendar{min-width:1320px}.calendar{grid-template-columns:52px repeat(7,180px)}}
</style>
</head>
<body>

    <div class="nav"><button class="arrow" id="prev">←</button><button class="today" id="today">TODAY</button><button class="arrow" id="next">→</button></div>

6 • GJ"], ["2026-05-18", "10:25", "11:20", "2i enB/HL", "D1 • PM"], ["2026-05-18", "11:50", "12:45", "2i enB/HL", "D1 • PM"], ["2026-05-18", "12:55", "13:50", "Revision - Written work", "C11 • LR"], ["2026-05-18", "14:00", "14:55", "2i psy/HL", "C11 • LR"], ["2026-05-19", "10:25", "11:20", "Revision - Written work", "B10 • LR"], ["2026-05-19", "11:50", "12:45", "2i psy/HL", "B10 • LR"], ["2026-05-20", "08:15", "09:10", "2i TOK/2", "C9 • RD"], ["2026-05-20", "09:20", "10:15", "2i TOK/2", "C9 • RD"], ["2026-05-20", "10:25", "11:20", "2i cas/2", "C14 • NI"], ["2026-05-20", "11:50", "14:55", "EE Research Modules", "2i st"], ["2026-05-21", "07:00", "14:55", "2i Collaborative Science Proj", "2i bio/HL"], ["2026-05-22", "08:15", "14:00", "2i Collaborative Science Proj", "2i bio/HL"], ["2026-05-26", "08:15", "14:55", "2i Science IA lab work + draft", "2i bio/HL"], ["2026-06-01", "09:15", "09:45", "EE DA", "D1 • GJ"], ["2026-06-01", "10:00", "11:00", "EE Workshop: referencing, etc", "C14"], ["2026-06-03", "08:15", "14:55", "EE Writing Days + Draft", "Alle 2i-elever"], ["2026-06-04", "08:15", "14:55", "EE Writing Days + Draft", "Alle 2i-elever"], ["2026-06-22", "08:15", "14:55", "EE Writing Days", "Alle 2i-elever"], ["2026-06-23", "08:15", "14:55", "EE Writing Days", "Alle 2i-elever"]];
const START=6*60+45, END=22*60+30, PX=1.08, TODAY=new Date("2026-04-30T12:00:00");
const SYNC_START=new Date("2026-04-27T00:00:00"), SYNC_END=new Date("2026-06-26T23:59:00");
const dayNames=["MON","TUE","WED","THU","FRI","SAT","SUN"];
const fmt=new Intl.DateTimeFormat("en-GB",{day:"numeric",month:"numeric"});
let currentMonday=startOfWeek(TODAY);
function min(t){const [h,m]=t.split(":").map(Number);return h*60+m}
function hm(m){return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function startOfWeek(d){const x=new Date(d);const day=x.getDay()||7;x.setDate(x.getDate()-day+1);x.setHours(0,0,0,0);return x}
function isoWeek(d){const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-n);const y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil((((x-y)/86400000)+1)/7)}
function ev(start,end,title,type,meta=""){return{start,end,title,type,meta}}
function schoolBlocks(date){return SCHOOL_ROWS.filter(r=>r[0]===date).map(r=>ev(r[1], min(r[2])>min("14:55")?"14:55":r[2], r[3], "school", r[4])).filter(e=>min(e.start)<min(e.end)&&min(e.start)<min("14:55"))}
function blocksFor(date,i,week){const ds=ymd(date), weekend=i>=5, workWeekend=week%2===0&&weekend;let b=[];if(workWeekend){return [ev("06:45","14:15","Work","work","Weekend shift"),ev("14:15","14:45","Wind down","wind",""),ev("14:45","21:20","Agency prep","agency","Business work block"),ev("21:20","22:30","Evening routine","evening","")]}
const school=schoolBlocks(ds);if(!school.some(s=>min(s.start)<min("07:45")&&min(s.end)>min("06:45")))b.push(ev("06:45","07:45","Morning routine","routine",""));b.push(...school);
let prepStart="08:15";if(school.length){const last=Math.max(...school.map(s=>min(s.end)));const commuteEnd=Math.min(last+25,min("21:20"));const windEnd=Math.min(commuteEnd+20,min("21:20"));if(windEnd>commuteEnd)b.push(ev(hm(commuteEnd),hm(windEnd),"Wind down","wind",""));prepStart=hm(windEnd)}
if(min(prepStart)<min("21:20"))b.push(ev(prepStart,"21:20","Agency prep","agency","Business work block"));b.push(ev("21:20","22:30","Evening routine","evening",""));return b.sort((a,b)=>min(a.start)-min(b.start))}
function eventEl(e){const el=document.createElement("div");const dur=min(e.end)-min(e.start);el.className="event "+e.type+(dur<30?" compact":"");el.style.top=(min(e.start)-START)*PX+"px";el.style.height=Math.max(18,dur*PX-4)+"px";el.innerHTML=`<div class="time">${e.start}-${e.end}</div><div class="title">${esc(e.title)}</div>${e.meta?`<div class="meta">${esc(e.meta)}</div>`:""}`;return el}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
function render(){const week=isoWeek(currentMonday), weekEnd=addDays(currentMonday,6), synced=weekEnd>=SYNC_START&&currentMonday<=SYNC_END;document.getElementById("weekBadge").textContent="WEEK "+week;const sb=document.getElementById("syncBadge");sb.textContent=synced?"SYNCED":"NOT SYNCED";sb.className="badge "+(synced?"synced":"unsynced");const cal=document.getElementById("calendar");cal.innerHTML="";
const timecol=document.createElement("div");timecol.className="timecol";const tg=document.createElement("div");tg.className="grid";tg.style.marginTop="54px";["06:45","07:00","08:00","09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00","20:00","21:00","22:00"].forEach(t=>{const l=document.createElement("div");l.className="tlabel";l.style.top=(min(t)-START)*PX+"px";l.textContent=t;tg.appendChild(l)});timecol.appendChild(tg);cal.appendChild(timecol);
for(let i=0;i<7;i++){const d=addDays(currentMonday,i), ds=ymd(d);const col=document.createElement("div");col.className="day "+(ds===ymd(TODAY)?"todayCol":"");const head=document.createElement("div");head.className="head";head.textContent=`${dayNames[i]} (${fmt.format(d)})`;const grid=document.createElement("div");grid.className="grid";blocksFor(d,i,week).forEach(e=>grid.appendChild(eventEl(e)));col.appendChild(head);col.appendChild(grid);cal.appendChild(col)}}
document.getElementById("prev").onclick=()=>{currentMonday=addDays(currentMonday,-7);render()};document.getElementById("next").onclick=()=>{currentMonday=addDays(currentMonday,7);render()};document.getElementById("today").onclick=()=>{currentMonday=startOfWeek(TODAY);render()};render();
