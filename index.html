<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal OS Weekly Schedule</title><style>:root{--px:1.22px}*{box-sizing:border-box}body{margin:0;background:#000;color:#f7f3ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh;background:#000;padding:14px}.topbar{height:84px;border:1px solid #322057;border-radius:18px;background:linear-gradient(180deg,#0d0b15,#05050a);display:flex;justify-content:space-between;align-items:center;padding:18px 22px;box-shadow:0 0 38px rgba(91,42,169,.18)}.badges{display:flex;gap:10px}.badge{border:1px solid #433060;background:#0b0a13;border-radius:8px;padding:9px 14px;color:#fff;font-size:14px;letter-spacing:.12em;font-weight:1000}.synced{color:#49ff9f;border-color:#136b51;background:rgba(16,194,119,.1)}.unsynced{color:#ff6d79;border-color:#7b1c2b;background:rgba(255,91,110,.1)}.nav{display:flex;gap:12px}.nav button{height:50px;border-radius:12px;border:1px solid #49306c;background:#090812;color:#fff;font-weight:1000;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(166,108,255,.06);display:flex;align-items:center;justify-content:center;line-height:1}.nav .arrow{width:60px;font-size:24px}.nav .today{min-width:112px;font-size:15px;letter-spacing:.08em}.nav button:hover{border-color:#9b6cff;background:#120d20}.calendar{margin-top:16px;display:grid;grid-template-columns:62px repeat(7,1fr);border:1px solid #2b2147;border-radius:16px;overflow:hidden;background:#05050a;box-shadow:0 20px 60px rgba(0,0,0,.65)}.timecol,.day{position:relative;min-height:calc((945 * var(--px)) + 54px);background:#05050a;border-right:1px solid #2b2147}.day:last-child{border-right:0}.head{height:54px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #2b2147;background:#070710;font-weight:1000;letter-spacing:.16em;font-size:14px}.todayCol .head{color:#b875ff;box-shadow:inset 0 2px 0 #9b6cff}.grid{position:relative;height:calc(945 * var(--px));background:linear-gradient(to bottom,rgba(255,255,255,.055) 1px,transparent 1px) 0 0/100% calc(60 * var(--px))}.tlabel{position:absolute;right:9px;transform:translateY(-50%);font-size:14px;font-weight:1000;text-shadow:0 0 8px rgba(155,108,255,.8)}.event{position:absolute;left:8px;right:8px;border:1px solid;border-radius:10px;padding:8px 10px;overflow:hidden}.event .time{font-size:11px;font-weight:1000;margin-bottom:3px}.event .title{font-size:14px;font-weight:1000;line-height:1.12}.small{padding:3px 8px;border-radius:8px}.small .time{font-size:10px;margin-bottom:1px}.small .title{font-size:11px;line-height:1}.wind.small .title{display:none}.wind.small{display:flex;align-items:center}.wind.small .time{font-size:12px;margin:0}.routine{background:rgba(80,24,137,.34);border-color:#8e4bff;color:#caa9ff}.school{background:rgba(8,28,56,.74);border-color:#0d77ff;color:#2c8dff}.wind{background:rgba(8,96,52,.45);border-color:#17b66e;color:#78ffc0}.homework{background:rgba(0,88,110,.58);border-color:#31e7ff;color:#bdf9ff}.focus{background:rgba(76,0,45,.58);border-color:#ff45d6;color:#ff69e2}.break{background:rgba(30,24,48,.72);border-color:#6a4aa8;color:#cdb8ff}.work{background:rgba(90,51,0,.48);border-color:#ffb33f;color:#ffd17b}.evening{background:rgba(45,23,84,.5);border-color:#9b6cff;color:#dac4ff}@media(max-width:1100px){.app{overflow-x:auto}.topbar,.calendar{min-width:1320px}.calendar{grid-template-columns:52px repeat(7,180px)}}</style></head><body><div class="app"><div class="topbar"><div class="badges"><span class="badge" id="weekBadge">WEEK</span><span class="badge unsynced" id="syncBadge">LOADING</span></div><div class="nav"><button class="arrow" id="prev">←</button><button class="today" id="today">TODAY</button><button class="arrow" id="next">→</button></div></div><div id="calendar" class="calendar"></div></div><script>

let SCHOOL_ROWS=parsePipe(fallbackSchoolCSV),HOMEWORK_ROWS=parsePipe(fallbackHomeworkCSV),DATA_SOURCE='fallback';
const START=405,END=1350,PX=1.22,TODAY=new Date(),DAYS=['MON','TUE','WED','THU','FRI','SAT','SUN'],fmt=new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'numeric'});let currentMonday=startOfWeek(TODAY);
function parsePipe(s){return s.trim().split('\n').filter(Boolean).map(x=>x.split('|'))}function min(t){const[a,b]=String(t||'').slice(0,5).split(':').map(Number);return a*60+b}function hm(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}function startOfWeek(d){const x=new Date(d),day=x.getDay()||7;x.setDate(x.getDate()-day+1);x.setHours(0,0,0,0);return x}function isoWeek(d){const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),n=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-n);const y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil((((x-y)/86400000)+1)/7)}function ev(start,end,title,type){return{start,end,title,type}}
function dateOf(v){if(!v)return'';if(v instanceof Date)return ymd(v);const s=String(v);const m=s.match(/\d{4}-\d{2}-\d{2}/);if(m)return m[0];const d=new Date(s);return Number.isNaN(d.getTime())?'':ymd(d)}function timeOf(v){if(!v)return'';const s=String(v);const m=s.match(/\b\d{1,2}:\d{2}\b/);if(m)return m[0].padStart(5,'0');const d=new Date(s);return Number.isNaN(d.getTime())?'':String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function firstArray(obj,names){for(const n of names){const v=n.split('.').reduce((a,k)=>a&&a[k],obj);if(Array.isArray(v))return v}return []}
function normalizeLectio(raw){const root=raw&&raw.ok&&raw.data?raw.data:raw;const schoolSrc=Array.isArray(root)?root:firstArray(root,['school','lessons','events','schedule','items','classes','data.school','data.lessons','data.events','data.schedule','data.items']);const hwSrc=firstArray(root,['homework','assignments','homeworks','tasks','data.homework','data.assignments','data.homeworks','data.tasks']);const school=schoolSrc.map(x=>{const date=dateOf(x.date||x.day||x.startDate||x.start||x.begin||x.from);const start=timeOf(x.start||x.begin||x.from||x.startTime);const end=timeOf(x.end||x.finish||x.to||x.endTime);const title=x.title||x.subject||x.name||x.course||x.text||x.className||'School';return[date,start,end,String(title)]}).filter(r=>r[0]&&r[1]&&r[2]&&min(r[1])<895);const homework=hwSrc.map(x=>{const date=dateOf(x.date||x.dueDate||x.deadline||x.day);const subject=x.subject||x.course||x.className||x.title||x.name||'Homework';return[date,String(subject)]}).filter(r=>r[0]&&r[1]);return{school,homework}}
async function loadLectio(){try{const res=await fetch('./lectio.json?cache='+Date.now(),{cache:'no-store'});if(!res.ok)return;const txt=(await res.text()).trim();if(!txt)return;const data=normalizeLectio(JSON.parse(txt));if(data.school.length){SCHOOL_ROWS=data.school;HOMEWORK_ROWS=data.homework;DATA_SOURCE='lectio'}}catch(e){console.warn('lectio.json fallback:',e.message)}}
function schoolBlocks(date){return SCHOOL_ROWS.filter(r=>r[0]===date).map(r=>ev(r[1],min(r[2])>895?'14:55':r[2],r[3],'school')).filter(e=>min(e.start)<min(e.end)&&min(e.start)<895)}function nextHomework(date){const nd=ymd(addDays(date,1));return[...new Set(HOMEWORK_ROWS.filter(r=>r[0]===nd).map(r=>r[1]))]}
function addSessions(b,start,end,date,schoolMins=0){let t=min(start),limit=min(end),heavy=schoolMins>=220,focusLen=heavy?60:85,breakLen=20,n=1;for(const h of nextHomework(date)){if(t+30<=limit){b.push(ev(hm(t),hm(t+30),h+' HW','homework'));t+=30}}while(t+25<=limit){let left=limit-t;if(left<=focusLen+breakLen+30){b.push(ev(hm(t),hm(limit),n===1?'Agency sprint':'Agency sprint '+n,'focus'));break}b.push(ev(hm(t),hm(t+focusLen),'Agency sprint '+n,'focus'));t+=focusLen;if(limit-t>=breakLen+30){b.push(ev(hm(t),hm(t+breakLen),'Break','break'));t+=breakLen}n++}}
function blocksFor(date,i,week){const weekend=i>=5,workWeekend=week%2===0&&weekend,wednesday=i===2;let b=[];if(workWeekend){b.push(ev('06:45','14:15','Work','work'),ev('14:15','14:45','Wind down','wind'));addSessions(b,'14:45','21:20',date,0);b.push(ev('21:20','22:30','Evening routine','evening'));return b}const school=schoolBlocks(ymd(date)),schoolMins=school.reduce((a,s)=>a+min(s.end)-min(s.start),0);if(!school.some(s=>min(s.start)<465&&min(s.end)>405))b.push(ev('06:45','07:45','Morning routine','routine'));b.push(...school);let prep='08:15';if(school.length){const last=Math.max(...school.map(s=>min(s.end))),home=Math.min(last+25,1275),windEnd=Math.min(home+20,1275);if(windEnd>home)b.push(ev(hm(home),hm(windEnd),'Wind down','wind'));prep=hm(windEnd)}if(wednesday){if(min(prep)<1005)addSessions(b,prep,'16:45',date,schoolMins);b.push(ev('16:45','21:30','Work','work'),ev('21:30','22:30','Evening routine','evening'))}else{if(min(prep)<1280)addSessions(b,prep,'21:20',date,schoolMins);b.push(ev('21:20','22:30','Evening routine','evening'))}return b.sort((a,b)=>min(a.start)-min(b.start))}
function eventEl(e){const el=document.createElement('div'),dur=min(e.end)-min(e.start),h=Math.max(12,dur*PX-6);el.className='event '+e.type+(dur<=30?' small':'');el.style.top=(min(e.start)-START)*PX+'px';el.style.height=h+'px';el.innerHTML=`<div class="time">${e.start}-${e.end}</div><div class="title">${esc(e.title)}</div>`;return el}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function render(){const week=isoWeek(currentMonday);document.getElementById('weekBadge').textContent='WEEK '+week;const sb=document.getElementById('syncBadge');sb.textContent=DATA_SOURCE==='lectio'?'LECTIO':'FALLBACK';sb.className='badge '+(DATA_SOURCE==='lectio'?'synced':'unsynced');const cal=document.getElementById('calendar');cal.innerHTML='';const tc=document.createElement('div');tc.className='timecol';const tg=document.createElement('div');tg.className='grid';tg.style.marginTop='54px';['06:45','07:00','08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00','21:00','22:00'].forEach(t=>{const l=document.createElement('div');l.className='tlabel';l.style.top=(min(t)-START)*PX+'px';l.textContent=t;tg.appendChild(l)});tc.appendChild(tg);cal.appendChild(tc);for(let i=0;i<7;i++){const d=addDays(currentMonday,i),ds=ymd(d),col=document.createElement('div');col.className='day '+(ds===ymd(TODAY)?'todayCol':'');const head=document.createElement('div');head.className='head';head.textContent=`${DAYS[i]} (${fmt.format(d)})`;const grid=document.createElement('div');grid.className='grid';blocksFor(d,i,week).forEach(e=>grid.appendChild(eventEl(e)));col.appendChild(head);col.appendChild(grid);cal.appendChild(col)}}
document.getElementById('prev').onclick=()=>{currentMonday=addDays(currentMonday,-7);render()};document.getElementById('next').onclick=()=>{currentMonday=addDays(currentMonday,7);render()};document.getElementById('today').onclick=()=>{currentMonday=startOfWeek(TODAY);render()};loadLectio().then(render);
