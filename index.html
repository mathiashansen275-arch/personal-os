<!doctype html>
<html lang="en">
<head>

<title>Personal OS Weekly Schedule</title>
<style>
:root{--px:1.22px;--line:#2b2147;--purple:#9b6cff;--text:#f7f3ff}*{box-sizing:border-box}body{margin:0;background:#000;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh;background:#000;padding:14px}.topbar{height:84px;border:1px solid #322057;border-radius:18px;background:linear-gradient(180deg,#0d0b15,#05050a);display:flex;justify-content:space-between;align-items:center;padding:18px 22px;box-shadow:0 0 38px rgba(91,42,169,.18)}.badges,.nav{display:flex;gap:10px;align-items:center}.badge{border:1px solid #433060;background:#0b0a13;border-radius:8px;padding:9px 14px;color:#fff;font-size:14px;letter-spacing:.12em;font-weight:1000}.synced{color:#49ff9f;border-color:#136b51;background:rgba(16,194,119,.1)}.unsynced{color:#ff6d79;border-color:#7b1c2b;background:rgba(255,91,110,.1)}button{height:50px;border-radius:12px;border:1px solid #49306c;background:#090812;color:#fff;font-weight:1000;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;letter-spacing:.06em}button:hover{border-color:#9b6cff;background:#120d20}.arrow{width:60px;font-size:24px}.today{min-width:112px;font-size:15px}.addBtn{min-width:116px;font-size:14px;color:#e9ddff;background:linear-gradient(180deg,#1b1030,#0c0914)}.calendar{margin-top:16px;display:grid;grid-template-columns:62px repeat(7,1fr);border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#05050a;box-shadow:0 20px 60px rgba(0,0,0,.65)}.timecol,.day{position:relative;min-height:calc((945 * var(--px)) + 54px);background:#05050a;border-right:1px solid var(--line)}.day:last-child{border-right:0}.head{height:54px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);background:#070710;font-weight:1000;letter-spacing:.16em;font-size:14px}.todayCol .head{color:#b875ff;box-shadow:inset 0 2px 0 #9b6cff}.grid{position:relative;height:calc(945 * var(--px));background:linear-gradient(to bottom,rgba(255,255,255,.055) 1px,transparent 1px) 0 0/100% calc(60 * var(--px))}.tlabel{position:absolute;right:9px;transform:translateY(-50%);font-size:14px;font-weight:1000;text-shadow:0 0 8px rgba(155,108,255,.8)}.event{position:absolute;left:8px;right:8px;border:1px solid;border-radius:10px;padding:8px 10px;overflow:hidden;transition:transform .08s ease,filter .08s ease,box-shadow .08s ease}.event.editable{cursor:pointer}.event.editable:hover{transform:translateY(-1px);filter:brightness(1.12);box-shadow:0 0 0 1px rgba(255,255,255,.14),0 12px 24px rgba(0,0,0,.35)}.event .time{font-size:11px;font-weight:1000;margin-bottom:3px}.event .title{font-size:14px;font-weight:1000;line-height:1.12}.small{padding:3px 8px;border-radius:8px}.small .time{font-size:10px;margin-bottom:1px}.small .title{font-size:11px;line-height:1}.wind.small .title{display:none}.wind.small{display:flex;align-items:center}.wind.small .time{font-size:12px;margin:0}.routine{background:rgba(80,24,137,.34);border-color:#8e4bff;color:#caa9ff}.school{background:rgba(8,28,56,.74);border-color:#0d77ff;color:#2c8dff}.wind{background:rgba(8,96,52,.45);border-color:#17b66e;color:#78ffc0}.homework{background:rgba(0,88,110,.58);border-color:#31e7ff;color:#bdf9ff}.focus{background:rgba(76,0,45,.58);border-color:#ff45d6;color:#ff69e2}.break{background:rgba(30,24,48,.72);border-color:#6a4aa8;color:#cdb8ff}.work{background:rgba(90,51,0,.48);border-color:#ffb33f;color:#ffd17b}.evening{background:rgba(45,23,84,.5);border-color:#9b6cff;color:#dac4ff}.trip{background:rgba(0,77,103,.58);border-color:#3fe4ff;color:#c8f8ff}.personal{background:rgba(44,79,37,.56);border-color:#8dff74;color:#d8ffd1}.errand{background:rgba(83,65,0,.56);border-color:#ffe066;color:#fff1a8}.deep{background:rgba(88,0,74,.58);border-color:#ff71ec;color:#ffd0f8}.neutral{background:rgba(37,37,46,.72);border-color:#a6a6c8;color:#eeeefa}.modalShade{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:22px}.modalShade.open{display:flex}.modal{width:min(760px,96vw);border:1px solid #4b3170;background:linear-gradient(180deg,#100b1b,#050509);border-radius:22px;padding:20px;box-shadow:0 0 60px rgba(155,108,255,.24),0 30px 90px rgba(0,0,0,.65)}.modalHead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}.modalTitle{font-size:24px;font-weight:1000;letter-spacing:.02em}.modalSub{margin-top:5px;color:#a99dc5;font-size:13px}.x{width:42px;height:42px;font-size:20px}.formGrid{display:grid;grid-template-columns:1.2fr .8fr .65fr .65fr;gap:12px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:11px;font-weight:1000;color:#b8a7dc;letter-spacing:.12em;text-transform:uppercase}input,select{height:44px;border-radius:11px;border:1px solid #352456;background:#090812;color:#fff;padding:0 12px;font-weight:800;outline:none}input:focus,select:focus{border-color:#9b6cff;box-shadow:0 0 0 2px rgba(155,108,255,.16)}.toggles{display:flex;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap}.checkline{height:44px;padding:0 13px;border:1px solid #352456;background:#090812;border-radius:11px;display:flex;align-items:center;gap:9px;font-weight:900;color:#e7dcff}.checkline input{height:auto}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.leftActions,.rightActions{display:flex;gap:10px}.danger{border-color:#6e2730;color:#ff8f9a;background:rgba(80,16,24,.22)}.primary{border-color:#7f52ff;background:linear-gradient(180deg,#7b42ff,#482096)}.ghost{color:#d7c8ff}.hint{margin-top:12px;color:#8f82aa;font-size:12px;line-height:1.4}.toast{position:fixed;right:18px;bottom:18px;background:#0b0a13;border:1px solid #49306c;border-radius:12px;padding:12px 14px;color:#e8dcff;font-weight:900;z-index:80;display:none}.toast.show{display:block}@media(max-width:1100px){.app{overflow-x:auto}.topbar,.calendar{min-width:1320px}.calendar{grid-template-columns:52px repeat(7,180px)}}@media(max-width:760px){.formGrid{grid-template-columns:1fr 1fr}.field.titleField{grid-column:1/-1}.actions{flex-direction:column}.leftActions,.rightActions{justify-content:stretch}.leftActions button,.rightActions button{flex:1}}
</style>
</head>
<body>
<div class="app"><div class="topbar"><div class="badges"><span class="badge" id="weekBadge">WEEK</span><span class="badge unsynced" id="syncBadge">LOADING</span></div><div class="nav"><button class="addBtn" id="addBlock">+ BLOCK</button><button class="arrow" id="prev">←</button><button class="today" id="today">TODAY</button><button class="arrow" id="next">→</button></div></div><div id="calendar" class="calendar"></div></div>
<div class="modalShade" id="modalShade"><div class="modal"><div class="modalHead"><div><div class="modalTitle" id="modalTitle">Add block</div><div class="modalSub" id="modalSub">School blocks are locked. Everything else can be adjusted locally.</div></div><button class="x" id="closeModal">×</button></div><form id="blockForm"><div class="formGrid"><div class="field titleField"><label>Title</label><input id="fTitle" autocomplete="off" placeholder="Trip to mum" /></div><div class="field"><label>Date</label><input id="fDate" type="date" /></div><div class="field"><label>Start</label><input id="fStart" type="time" step="300" /></div><div class="field"><label>End</label><input id="fEnd" type="time" step="300" /></div><div class="field"><label>Color</label><select id="fType"><option value="auto">Auto color</option><option value="focus">Agency / pink</option><option value="work">Work / orange</option><option value="trip">Trip / cyan</option><option value="personal">Personal / green</option><option value="errand">Errand / yellow</option><option value="deep">Deep work / magenta</option><option value="homework">Homework / teal</option><option value="break">Break / purple</option><option value="routine">Routine / violet</option><option value="neutral">Neutral</option></select></div></div><div class="toggles" id="addOptions"><label class="checkline"><input id="fPomodoro" type="checkbox" /> Pomodoro sessions</label><label class="checkline"><input id="fAutoTitle" type="checkbox" checked /> Number sessions</label></div><div class="hint" id="modalHint">Pomodoro creates focused blocks and clean breaks that fit the selected time. After creation, every session and break can be clicked, edited, recolored, resized, or deleted.</div><div class="actions"><div class="leftActions"><button type="button" class="danger" id="deleteBlock">DELETE</button></div><div class="rightActions"><button type="button" class="ghost" id="cancelModal">CANCEL</button><button type="submit" class="primary" id="saveBlock">SAVE</button></div></div></form></div></div><div class="toast" id="toast"></div>
<script>
const START=405,END=1350,PX=1.22,DAYS=['MON','TUE','WED','THU','FRI','SAT','SUN'],fmt=new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'numeric'}),TODAY=new Date(),STORE_KEY='personalOS.schedule.v2';
let currentMonday=startOfWeek(TODAY),DATA_SOURCE='loading',SCHOOL_ROWS=[],HOMEWORK_ROWS=[],state=loadState(),editing=null;
const FALLBACK={school:[{date:'2026-05-01',start:'08:15',end:'09:10',title:'Probability of events'},{date:'2026-05-01',start:'09:20',end:'10:15',title:'2i maAI/SL2'},{date:'2026-05-01',start:'10:25',end:'11:20',title:'2i enB/HL'},{date:'2026-05-01',start:'11:50',end:'12:45',title:'2i enB/HL'},{date:'2026-05-01',start:'12:55',end:'13:50',title:'IA pilots'},{date:'2026-05-01',start:'14:00',end:'14:55',title:'2i bio/SL'}],homework:[]};
function loadState(){try{const s=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');return{custom:Array.isArray(s.custom)?s.custom:[],overrides:s.overrides||{},hidden:Array.isArray(s.hidden)?s.hidden:[]}}catch{return{custom:[],overrides:{},hidden:[]}}}
function saveState(){localStorage.setItem(STORE_KEY,JSON.stringify(state))}
function uid(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function min(t){const[a,b]=String(t||'').slice(0,5).split(':').map(Number);return a*60+b}function hm(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}function startOfWeek(d){const x=new Date(d),day=x.getDay()||7;x.setDate(x.getDate()-day+1);x.setHours(0,0,0,0);return x}function isoWeek(d){const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),n=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-n);const y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil((((x-y)/86400000)+1)/7)}function dateOf(v){if(!v)return'';const s=String(v);const m=s.match(/\d{4}-\d{2}-\d{2}/);if(m)return m[0];const d=new Date(s);return Number.isNaN(d.getTime())?'':ymd(d)}function timeOf(v){if(!v)return'';const s=String(v);const m=s.match(/\b\d{1,2}:\d{2}\b/);return m?m[0].padStart(5,'0'):''}function cleanTitle(s){return String(s||'').trim()||'Untitled block'}function block(date,start,end,title,type,source='system'){return{date,start,end,title,type,source}}function sysId(e){return ['sys',e.date,e.start,e.end,e.type,slug(e.title)].join('|')}function slug(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,48)}function overlaps(a,b){return a.date===b.date&&min(a.start)<min(b.end)&&min(b.start)<min(a.end)}function isGeneratedType(t){return ['focus','break','homework'].includes(t)}
function useData(data,source){const real=!!(data&&Array.isArray(data.school)&&data.school.length);const d=real?data:FALLBACK;DATA_SOURCE=real?source:'fallback';SCHOOL_ROWS=(d.school||[]).map(x=>[dateOf(x.date),timeOf(x.start),timeOf(x.end),String(x.title||x.subject||x.name||'School')]).filter(r=>r[0]&&r[1]&&r[2]&&min(r[1])<895);HOMEWORK_ROWS=(d.homework||[]).map(x=>[dateOf(x.date||x.dueDate),String(x.subject||x.title||x.course||'Homework')]).filter(r=>r[0]&&r[1]);render()}function loadLectioData(){const s=document.createElement('script');s.src='./lectio-data.js?v='+Date.now();s.onload=()=>useData(window.LECTIO_DATA,'lectio');s.onerror=()=>useData(null,'fallback');document.head.appendChild(s)}
function schoolBlocks(date){return SCHOOL_ROWS.filter(r=>r[0]===date).map(r=>block(date,r[1],min(r[2])>895?'14:55':r[2],r[3],'school')).filter(e=>min(e.start)<min(e.end)&&min(e.start)<895)}function nextHomework(date){const nd=ymd(addDays(new Date(date+'T00:00:00'),1));return[...new Set(HOMEWORK_ROWS.filter(r=>r[0]===nd).map(r=>r[1]))]}
function addSessions(arr,date,start,end,schoolMins=0,label='Agency sprint',type='focus'){let t=min(start),limit=min(end),heavy=schoolMins>=220,focusLen=heavy?60:85,breakLen=20,n=1;for(const h of nextHomework(date)){if(t+30<=limit){arr.push(block(date,hm(t),hm(t+30),h+' HW','homework'));t+=30}}while(t+25<=limit){let left=limit-t;if(left<=focusLen+breakLen+30){arr.push(block(date,hm(t),hm(limit),n===1?label:label+' '+n,type));break}arr.push(block(date,hm(t),hm(t+focusLen),label+' '+n,type));t+=focusLen;if(limit-t>=breakLen+30){arr.push(block(date,hm(t),hm(t+breakLen),'Break','break'));t+=breakLen}n++}}
function addTwoSprints(arr,date,start,end){let t=min(start),limit=min(end);for(const h of nextHomework(date)){if(t+30<=limit){arr.push(block(date,hm(t),hm(t+30),h+' HW','homework'));t+=30}}if(limit-t<50){if(t<limit)arr.push(block(date,hm(t),hm(limit),'Agency sprint','focus'));return}const breakLen=20,workTotal=Math.max(0,limit-t-breakLen);if(workTotal<40){arr.push(block(date,hm(t),hm(limit),'Agency sprint','focus'));return}const first=Math.floor(workTotal/2);arr.push(block(date,hm(t),hm(t+first),'Agency sprint 1','focus'));t+=first;arr.push(block(date,hm(t),hm(t+breakLen),'Break','break'));t+=breakLen;arr.push(block(date,hm(t),hm(limit),'Agency sprint 2','focus'))}
function baseBlocksFor(dateObj,i,week){const date=ymd(dateObj),weekend=i>=5,workWeekend=week%2===0&&weekend,wednesday=i===2;let b=[];if(workWeekend){b.push(block(date,'06:45','14:15','Work','work'),block(date,'14:15','14:45','Wind down','wind'));addSessions(b,date,'14:45','21:20',0);b.push(block(date,'21:20','22:30','Evening routine','evening'));return b}const school=schoolBlocks(date),schoolMins=school.reduce((a,s)=>a+min(s.end)-min(s.start),0);if(!school.some(s=>min(s.start)<465&&min(s.end)>405))b.push(block(date,'06:45','07:45','Morning routine','routine'));b.push(...school);let prep='08:15';if(school.length){const last=Math.max(...school.map(s=>min(s.end))),home=Math.min(last+25,1275),windEnd=Math.min(home+20,1275);if(windEnd>home)b.push(block(date,hm(home),hm(windEnd),'Wind down','wind'));prep=hm(windEnd)}if(wednesday){if(min(prep)<1005)addTwoSprints(b,date,prep,'16:45');b.push(block(date,'16:45','21:30','Work','work'),block(date,'21:30','22:30','Evening routine','evening'))}else{if(min(prep)<1280)addSessions(b,date,prep,'21:20',schoolMins);b.push(block(date,'21:20','22:30','Evening routine','evening'))}return b.sort((a,b)=>min(a.start)-min(b.start))}
function blocksFor(dateObj,i,week){const date=ymd(dateObj),custom=state.custom.filter(e=>e.date===date),customBusy=custom.filter(e=>e.type!=='break');let base=baseBlocksFor(dateObj,i,week).map(e=>({...e,id:sysId(e),source:e.type==='school'?'school':'system'}));base=base.filter(e=>!state.hidden.includes(e.id));base=base.map(e=>state.overrides[e.id]?{...e,...state.overrides[e.id],id:e.id,source:e.source}:e);base=base.filter(e=>!(isGeneratedType(e.type)&&customBusy.some(c=>overlaps(e,c))));return[...base,...custom].sort((a,b)=>min(a.start)-min(b.start))}
function inferType(title){const t=String(title).toLowerCase();if(/mom|mum|trip|travel|train|bus|drive|visit|commute/.test(t))return'trip';if(/job|shift|work/.test(t))return'work';if(/homework|lektie|study|read|assignment/.test(t))return'homework';if(/gym|walk|friend|family|food|personal|chill/.test(t))return'personal';if(/errand|shop|buy|appointment/.test(t))return'errand';if(/routine|sleep|morning|evening/.test(t))return'routine';return'focus'}
function makePomodoro(date,start,end,title,type,numbered=true){let t=min(start),limit=min(end),total=limit-t;if(total<=0)return[];const out=[],breakLen=total>=240?20:10,focusLen=total>=300?75:(total>=150?60:50);let n=1;while(t<limit){const left=limit-t;if(left<=focusLen+breakLen+25){out.push({id:uid(),date,start:hm(t),end:hm(limit),title:numbered?title+' '+n:title,type,source:'custom'});break}out.push({id:uid(),date,start:hm(t),end:hm(t+focusLen),title:numbered?title+' '+n:title,type,source:'custom'});t+=focusLen;if(limit-t>=breakLen+25){out.push({id:uid(),date,start:hm(t),end:hm(t+breakLen),title:'Break',type:'break',source:'custom'});t+=breakLen}n++}return out}
function applyCustom(e){state.custom=state.custom.map(x=>x.id===e.id?e:x);saveState();render()}function addCustomBlocks(blocks){state.custom.push(...blocks);saveState();render();toast(blocks.length>1?'Pomodoro block added':'Block added')}function hideSystem(id){if(!state.hidden.includes(id))state.hidden.push(id);saveState();render();toast('Removed')}function saveOverride(id,patch){state.overrides[id]={...(state.overrides[id]||{}),...patch};saveState();render();toast('Updated')}
function eventEl(e){const el=document.createElement('div'),dur=min(e.end)-min(e.start),h=Math.max(12,dur*PX-6);el.className='event '+e.type+(dur<=30?' small':'')+(e.type!=='school'?' editable':'');el.style.top=(min(e.start)-START)*PX+'px';el.style.height=h+'px';el.dataset.id=e.id||'';el.innerHTML=`<div class="time">${e.start}-${e.end}</div><div class="title">${esc(e.title)}</div>`;return el}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function render(){const week=isoWeek(currentMonday);document.getElementById('weekBadge').textContent='WEEK '+week;const sb=document.getElementById('syncBadge');sb.textContent=DATA_SOURCE==='lectio'?'SYNCED':DATA_SOURCE.toUpperCase();sb.className='badge '+(DATA_SOURCE==='lectio'?'synced':'unsynced');const cal=document.getElementById('calendar');cal.innerHTML='';const tc=document.createElement('div');tc.className='timecol';const tg=document.createElement('div');tg.className='grid';tg.style.marginTop='54px';['06:45','07:00','08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00','21:00','22:00'].forEach(t=>{const l=document.createElement('div');l.className='tlabel';l.style.top=(min(t)-START)*PX+'px';l.textContent=t;tg.appendChild(l)});tc.appendChild(tg);cal.appendChild(tc);for(let i=0;i<7;i++){const d=addDays(currentMonday,i),ds=ymd(d),col=document.createElement('div');col.className='day '+(ds===ymd(TODAY)?'todayCol':'');const head=document.createElement('div');head.className='head';head.textContent=`${DAYS[i]} (${fmt.format(d)})`;const grid=document.createElement('div');grid.className='grid';blocksFor(d,i,week).forEach(e=>grid.appendChild(eventEl(e)));col.appendChild(head);col.appendChild(grid);cal.appendChild(col)}}
function openAdd(){editing=null;modalTitle.textContent='Add block';modalSub.textContent='Pick a title and time. Auto color chooses a fitting color.';addOptions.style.display='flex';deleteBlock.style.display='none';fTitle.value='';fDate.value=ymd(TODAY);fStart.value='14:45';fEnd.value='16:15';fType.value='auto';fPomodoro.checked=false;fAutoTitle.checked=true;setDateDisabled(false);showModal()}
function findRenderedBlock(id){const week=isoWeek(currentMonday);for(let i=0;i<7;i++){const found=blocksFor(addDays(currentMonday,i),i,week).find(e=>e.id===id);if(found)return found}return null}
function openEdit(e){if(!e||e.type==='school')return;editing=e;modalTitle.textContent='Edit block';modalSub.textContent=e.source==='system'?'Generated block. School stays locked; this block can be customized locally.':'Custom block. Changes are saved in this browser.';addOptions.style.display='none';deleteBlock.style.display='flex';fTitle.value=e.title;fDate.value=e.date;fStart.value=e.start;fEnd.value=e.end;fType.value=e.type;setDateDisabled(e.source==='system');showModal()}
function setDateDisabled(v){fDate.disabled=v;fDate.style.opacity=v?0.55:1}function showModal(){modalShade.classList.add('open');setTimeout(()=>fTitle.focus(),40)}function closeModal(){modalShade.classList.remove('open')}
addBlock.onclick=openAdd;closeModal.onclick=closeModal;cancelModal.onclick=closeModal;calendar.addEventListener('click',e=>{const node=e.target.closest('.event.editable');if(node)openEdit(findRenderedBlock(node.dataset.id))});
blockForm.addEventListener('submit',e=>{e.preventDefault();const title=cleanTitle(fTitle.value),date=fDate.value,start=fStart.value,end=fEnd.value;if(!date||!start||!end||min(end)<=min(start)){toast('Check date and time');return}const selected=fType.value,type=selected==='auto'?inferType(title):selected;if(!editing){if(fPomodoro.checked)addCustomBlocks(makePomodoro(date,start,end,title,type,fAutoTitle.checked));else addCustomBlocks([{id:uid(),date,start,end,title,type,source:'custom'}]);closeModal();return}if(editing.source==='custom'){applyCustom({...editing,title,date,start,end,type,source:'custom'});toast('Updated')}else saveOverride(editing.id,{title,start,end,type});closeModal()});
deleteBlock.onclick=()=>{if(!editing)return;if(editing.source==='custom'){state.custom=state.custom.filter(x=>x.id!==editing.id);saveState();render();toast('Deleted')}else hideSystem(editing.id);closeModal()};modalShade.addEventListener('click',e=>{if(e.target.id==='modalShade')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),1600)}
